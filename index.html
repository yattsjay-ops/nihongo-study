<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Nihongo Study</title>

 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap"
      rel="stylesheet">
   <link rel="stylesheet" href="style.css?v=3">
</head>


<body>

<header>

    <img
        src="YUZUKI NANASE.png"
        alt="Japanese Manga Header"
        class="header-image"
    >

    <p class="logo">
        🌸 Jayot Nganjut
    </p>

    <h1>
        Belajar Bahasa Jepang
    </h1>

    <p class="subtitle">
        Mari kita nganjut lewat manga & anime.
    </p>

</header>


<!-- SEARCH -->

<input
    type="text"
    id="searchInput"
    placeholder="Cari Ungkapan"
>


<!-- FOLDER KATEGORI -->

<div id="categoryList"></div>

<!-- TOMBOL KUIS -->

<button id="openQuizButton">
    🎯 Kuis Interaktif
</button>

<!-- BAGIAN KUIS -->

<div id="quizSection" style="display: none;">

    <button id="backFromQuizButton">
        ← Kembali ke Beranda
    </button>

    <h2>🎯 Kuis Kanji</h2>

    <p>Uji pemahaman kosakata bahasa Jepangmu!</p>

    <label for="quizCategorySelect">
        Pilih kategori:
    </label>

    <select id="quizCategorySelect">
        <option value="all">Semua Kategori</option>
    </select>

    <button id="startQuizButton">
        Mulai Kuis
    </button>

    <div id="quizCard" style="display: none;">

        <p id="quizProgress"></p>

        <h1 id="quizQuestion"></h1>

        <div id="quizOptions"></div>

        <p id="quizFeedback"></p>

        <button id="nextQuizButton" style="display: none;">
            Soal Berikutnya
        </button>

    </div>

    <div id="quizResult" style="display: none;"></div>

</div>
<!-- VOCABULARY -->

<div id="vocabularySection" style="display: none;">

    <button id="backButton">
        ← Kembali ke Folder
    </button>

    <h2>
        Vocabulary
    </h2>


    <!-- TOMBOL TAMBAH -->

    <button id="addVocabularyButton">
        ＋ Tambah Kosakata
    </button>


    <!-- FORM TAMBAH -->

    <div
        id="addVocabularyForm"
        style="display: none;"
    >
<input type="text" id="kanjiInput" placeholder="Kanji">

<input type="text" id="onyomiInput" placeholder="Onyomi">

<input type="text" id="kunyomiInput" placeholder="Kunyomi">

<input type="text" id="romajiInput" placeholder="Romaji">

<input type="text" id="artiInput" placeholder="Arti">

        <br><br>

        <button id="saveVocabularyButton">
            Simpan
        </button>

        <button id="cancelVocabularyButton">
            Batal
        </button>

    </div>


    <!-- DAFTAR VOCABULARY -->

    <div id="vocabularyList"></div>

</div>

<script src="script.js" defer></script>

</body>

</html>
